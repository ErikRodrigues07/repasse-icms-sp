version: '3.9'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: xxxxxxx
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=xxxxxxx
    ports:
      - "1111:1111"
    volumes:
      - sql_data:/var/opt/mssql

volumes:
  sql_data: